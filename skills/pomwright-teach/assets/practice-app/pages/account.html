<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Account | Practice shop</title>
  <link rel="stylesheet" href="/app.css">
</head>
<body>
  <header>
    <nav aria-label="Main">
      <a href="/">Shop</a>
      <a href="/products">Products</a>
      <a href="/cart">Cart</a>
      <a href="/login">Log in</a>
    </nav>
  </header>
  <main>
    <h1>Account</h1>
    <section aria-label="Orders">
      <h2>Orders</h2>
      <ul>
        <li>ORD-1042 Open</li>
        <li>ORD-1043 Shipped</li>
      </ul>
    </section>
  </main>
  <div role="dialog" aria-label="Cookies" hidden>
    <p>We use cookies to remember your cart.</p>
    <button type="button">Accept all</button>
    <button type="button">Reject all</button>
  </div>
  <script src="/app.js"></script>
  <script>
    document.querySelector("h1").textContent = `Account ${location.pathname.split("/").pop()}`;
  </script>
</body>
</html>
