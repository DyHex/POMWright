name: CI

# Pushes to main only. publish.yaml starts after this workflow succeeds, so it must never run on pull requests.

on:
  push:
    branches:
      - main

permissions:
  contents: read

# One run at a time: GitHub keeps one running and one waiting run per group, a newer push replaces the waiting run, and
# a running one is never canceled, so every run that starts finishes its checks. GitHub takes waiting runs in the
# order they began waiting, not in push order, so two pushes seconds apart can run out of order; and a re-run of an
# older run keeps its commit. Neither deploys an older commit over a newer one: pages.yaml deploys only main's tip and
# publish.yaml goes on only on it, so deployments follow commit order.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml
    with:
      browsers: '["chromium", "firefox", "webkit"]'
      older-node-lines: true # the chromium harness on Node 20 and 22 as well

  # The gate. Its job id is the required status check of main ("build") in the ruleset main: checks: do not rename it
  # without changing the ruleset with it.
  build:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the checks to have passed
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "checks: $RESULT"
          test "$RESULT" = "success"
