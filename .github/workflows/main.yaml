name: CI

# Pushes to main only. publish.yaml starts after this workflow succeeds, so it must never run on pull requests.

on:
  push:
    branches:
      - main

permissions:
  contents: read

# One run at a time, in push order, so publish.yaml and pages.yaml, which start when a run succeeds, follow the order
# of the commits: an older commit's run can never finish after a newer one's and deploy its site over the newer site.
# A run that is waiting gives way to a newer push (GitHub keeps one waiting run per group); a running one is never
# cancelled, so every run that starts finishes its checks. A re-run of an older run keeps its commit, so pages.yaml
# deploys only main's tip and publish.yaml goes on only on it: deployments follow commit order, re-runs included.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml
    with:
      browsers: '["chromium", "firefox", "webkit"]'
      node-floor: true # the chromium harness on Node 20 as well

  # The gate. Its job id is the required status check of main ("build"): do not rename it without changing the
  # branch protection rule with it.
  build:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the checks to have passed
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "checks: $RESULT"
          test "$RESULT" = "success"
