name: CI

# Pushes to main only. publish.yaml starts after this workflow succeeds, so it must never run on pull requests.

on:
  push:
    branches:
      - main

permissions:
  contents: read
  actions: read # checks.yaml reads the runs of this workflow to find the last green commit

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml
    with:
      browsers: '["chromium", "firefox", "webkit"]'
      workflow: main.yaml
      node-floor: true # the chromium harness on Node 20 as well

  # The gate. Its job id is the required status check of main ("build"): do not rename it without changing the
  # branch protection rule with it.
  build:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the checks to have passed
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "checks: $RESULT"
          test "$RESULT" = "success"
