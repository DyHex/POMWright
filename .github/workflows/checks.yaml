name: Checks

# The jobs of every CI run, called by pr.yaml (pull requests) and main.yaml (pushes to main). Every job runs on every
# run, whatever changed, so a run always tests what it reports on (on a pull request, GitHub's merge commit); skipping
# jobs by what changed saved minutes on docs-only pushes only. Lint runs biome and actionlint.
# The package job builds and packs once; every harness job, the consumer job and the site job test that tarball. The harness runs on the
# browsers the caller asks for, each at the Playwright pin and at the latest 1.x, on Node 24, the default; with
# older-node-lines (set by pr.yaml and main.yaml) also on chromium at the pin on every LTS Node line below the default,
# from the engines floor: 20 and 22. The list moves with Node's schedule: a line joins when it is LTS, the floor's line
# leaves when engines moves, and issue #55 makes 26 the default and moves 24 here (the unit tests stay on the default:
# vitest needs 22.12). The test-server job checks, once per run, that no page of the test server loads anything from
# another host. Third-party actions are pinned to commits, the version in a comment; Dependabot
# (.github/dependabot.yml) proposes updates.

on:
  workflow_call:
    inputs:
      browsers:
        description: JSON array of the Playwright projects the harness runs, each at the pin and at the latest version
        type: string
        default: '["chromium", "firefox", "webkit"]'
      older-node-lines:
        description: Also run the chromium harness at the pin on each older LTS Node line, from the engines floor
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # actionlint over .github/workflows, with ShellCheck over their run: scripts. Both are pinned here, each version
      # with its SHA-256 (ShellCheck's releases publish none: computed from the release archive), so CI and a local run
      # use the same versions whatever the runner image has; they move by hand, since Dependabot does not see them.
      - name: Lint the workflows
        shell: bash # -eo pipefail: a failed command anywhere in a pipe fails the step
        env:
          ACTIONLINT_VERSION: 1.7.12
          ACTIONLINT_SHA256: 8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8
          SHELLCHECK_VERSION: 0.11.0
          SHELLCHECK_SHA256: 8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198
        run: |
          archive="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${archive}"
          echo "${ACTIONLINT_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xzf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" actionlint
          archive="shellcheck-v${SHELLCHECK_VERSION}.linux.x86_64.tar.xz"
          curl -sSfL -o "$RUNNER_TEMP/$archive" \
            "https://github.com/koalaman/shellcheck/releases/download/v${SHELLCHECK_VERSION}/${archive}"
          echo "${SHELLCHECK_SHA256}  $RUNNER_TEMP/$archive" | sha256sum --check --strict
          tar -xJf "$RUNNER_TEMP/$archive" -C "$RUNNER_TEMP" --strip-components=1 "shellcheck-v${SHELLCHECK_VERSION}/shellcheck"
          # actionlint runs the first shellcheck on PATH: the pinned one
          PATH="$RUNNER_TEMP:$PATH" "$RUNNER_TEMP/actionlint" -color
          # actionlint prints nothing when it finds nothing
          echo "actionlint ${ACTIONLINT_VERSION}: no problems in $(cd .github/workflows && echo *.yaml)"
          echo "run: scripts checked with ShellCheck $("$RUNNER_TEMP/shellcheck" --version | sed -n 's/^version: //p')"
          # the release checks, which pr.yaml and publish.yaml run from a script rather than a run: block
          "$RUNNER_TEMP/shellcheck" scripts/release-check.sh scripts/release-check.test.sh
          echo "scripts/release-check.sh and its test checked with ShellCheck"
      # every path of the release checks, in throwaway repositories with a fake npm (seconds, no network)
      - name: Test the release checks
        run: bash scripts/release-check.test.sh

  package:
    name: Unit tests and package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - name: Build and pack
        run: bash pack-build.sh pomwright-test-build.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pomwright-package
          path: pomwright-test-build.tgz
          if-no-files-found: error
          retention-days: 7

  harness:
    name: Harness (${{ matrix.browser }}, Playwright ${{ matrix.playwright }})
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browsers) }}
        playwright: [pin, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # First, with the runner's own Node: a skipped job must not set up the pnpm cache, because setup-node's post
      # step fails when the store it should save does not exist.
      - id: playwright
        name: Resolve the Playwright version
        env:
          ROW: ${{ matrix.playwright }}
        run: bash scripts/ci-playwright-version.sh "$ROW"
      - if: steps.playwright.outputs.skip == 'true'
        name: The latest Playwright is the pin; the pin row runs it
        run: echo "Nothing to run."
      - if: steps.playwright.outputs.skip != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - if: steps.playwright.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/pnpm-lock.yaml
      - if: steps.playwright.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pomwright-package
          path: ${{ runner.temp }}/package
      - if: steps.playwright.outputs.skip != 'true'
        name: Run the harness against the packed package
        env:
          CI: "true"
          POMWRIGHT_TARBALL: ${{ runner.temp }}/package/pomwright-test-build.tgz
          PLAYWRIGHT_VERSION: ${{ steps.playwright.outputs.version }}
          PLAYWRIGHT_INSTALL_ARGS: --with-deps ${{ matrix.browser }}
          PROJECT: ${{ matrix.browser }}
        run: bash pack-test.sh --project="$PROJECT"
      - if: failure() && steps.playwright.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.playwright }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/playwright-report
          retention-days: 30

  # The chromium harness at the pin on each LTS Node line below the default (Node 24), from the engines floor.
  harness-node:
    name: Harness (chromium, Playwright pin, Node ${{ matrix.node }})
    needs: package
    if: inputs.older-node-lines
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}.x
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/pnpm-lock.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pomwright-package
          path: ${{ runner.temp }}/package
      - name: Run the harness against the packed package on Node ${{ matrix.node }}
        env:
          CI: "true"
          POMWRIGHT_TARBALL: ${{ runner.temp }}/package/pomwright-test-build.tgz
          PLAYWRIGHT_INSTALL_ARGS: --with-deps chromium
        run: bash pack-test.sh --project=chromium
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-chromium-node${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/playwright-report
          retention-days: 30

  # No page of the test server loads anything from another host (test-server-check.sh): every route test/server.js
  # lists, opened in chromium, and a scan of the server's source and test data. Once per run, in a job of its own: what
  # a page requests depends on no browser, Playwright version or Node line, and a failure here is not a harness failure.
  test-server:
    name: "Test server: no external requests"
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: test/pnpm-lock.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pomwright-package
          path: ${{ runner.temp }}/package
      - name: Open every page of the test server, and scan its source and test data
        env:
          CI: "true"
          POMWRIGHT_TARBALL: ${{ runner.temp }}/package/pomwright-test-build.tgz
          PLAYWRIGHT_INSTALL_ARGS: --with-deps chromium
        run: bash test-server-check.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-test-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/playwright-report/test-server
          retention-days: 30

  # The package as consumers install it, with npm into projects of their own rather than the harness's: TypeScript under
  # each module resolution, attw, Playwright's runner in a CommonJS and an ESM project, and TypeScript 5.0 to the latest
  # release in both decorator modes (scripts/consumer-check.sh, which runs the same by hand); then, on Node 20, the
  # engines floor, import and require sharing one copy.
  consumer:
    name: Consumer installs
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pomwright-package
          path: ${{ runner.temp }}/package
      - name: TypeScript resolutions and versions, attw, Playwright's runner
        shell: bash
        run: bash scripts/consumer-check.sh "$RUNNER_TEMP/package/pomwright-test-build.tgz"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x
      - name: import and require share one copy on Node 20
        shell: bash
        run: bash scripts/consumer-check.sh --node-floor "$RUNNER_TEMP/package/pomwright-test-build.tgz"

  # The documentation: its TypeScript examples compiled and the API reference checked against the packed package, as
  # the harness's type check does, then the site built, which fails on a link or an anchor that does not exist, and every
  # diagram rendered. pages.yaml deploys the same build.
  site:
    name: Documentation and site
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/pnpm-lock.yaml
            website/pnpm-lock.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pomwright-package
          path: ${{ runner.temp }}/package
      - name: Install the packed package into test/
        env:
          TARBALL: ${{ runner.temp }}/package/pomwright-test-build.tgz
        run: |
          pnpm install --frozen-lockfile
          bash pack-extract.sh "$TARBALL"
          pnpm -C test install --frozen-lockfile
      - name: Compile the documentation's examples
        run: node scripts/check-doc-snippets.mjs
      - name: Check the API reference and the doc comments
        run: node scripts/check-api-coverage.mjs
      - name: Build the site
        run: |
          pnpm -C website install --frozen-lockfile
          pnpm -C website build
      # Diagrams render in the browser, so the build cannot catch one that fails: each is opened in Chromium, light and
      # dark (scripts/check-diagrams.mjs, which pnpm docs:diagrams runs by hand)
      - name: Render every diagram
        run: |
          pnpm exec playwright install --with-deps chromium
          node scripts/check-diagrams.mjs
