name: Checks

# The jobs of every CI run, called by pr.yaml (pull requests) and main.yaml (pushes to main). Every job runs on every
# run, whatever changed, so a run always tests what it reports on (on a pull request, GitHub's merge commit); skipping
# jobs by what changed saved minutes on docs-only pushes only. Lint runs biome and actionlint.
# The package job builds and packs once; every harness job, the consumer job and the site job test that tarball. The harness runs on the
# browsers the caller asks for, each at the Playwright pin and at the latest 1.x, on Node 26, the default (NODE_VERSION
# below, every job's line in one place); with older-node-lines (set by pr.yaml and main.yaml) also on chromium at the pin
# on every LTS Node line below the default, from the engines floor: 20, 22 and 24. The list moves with Node's schedule:
# when a newer line is LTS it becomes the default and the old default joins the list, and the floor's line leaves when
# engines moves (the unit tests stay on the default: vitest needs 22.12). The test-server job checks, once per run, that
# no page of the test server loads anything from another host. Third-party actions are pinned to commits, the version in
# a comment; Dependabot (.github/dependabot.yml) proposes updates.
# With release set (daily.yaml, the Daily workflow), the run tests a published version instead of the checkout: the
# package job downloads its tarball from npm in place of the build, under the same artifact; harness and consumer check
# out release-commit, the commit it was published from, and run its tests and scripts; the harness runs the latest 1.x,
# even when it is the pin, and playwright-extra when set, with no pin row; every setup-node checks for the newest patch;
# lint, test-server and site are skipped, since a published commit gives them nothing new. pnpm's version then comes
# from that commit's packageManager, since pnpm/action-setup fails when an explicit version differs from it. With
# release empty, as pr.yaml and main.yaml call it, every job is as described above.

on:
  workflow_call:
    inputs:
      browsers:
        description: JSON array of the Playwright projects the harness runs, each at the pin and at the latest version
        type: string
        default: '["chromium", "firefox", "webkit"]'
      older-node-lines:
        description: Also run the chromium harness at the pin on each older LTS Node line, from the engines floor
        type: boolean
        default: false
      release:
        description: A pomwright version on npm to test in place of the checkout (daily.yaml); empty, the checkout
        type: string
        default: ""
      release-commit:
        description: With release, the commit it was published from, whose tests and scripts run against it
        type: string
        default: ""
      playwright-extra:
        description: With release, a second Playwright version for the harness beside the latest 1.x; empty, none
        type: string
        default: ""

permissions:
  contents: read

env:
  NODE_VERSION: 26.x # the default line of every job; publish.yaml and pages.yaml name the same

jobs:
  lint:
    name: Lint
    if: inputs.release == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # actionlint over .github/workflows with ShellCheck, both pinned in the script, which `pnpm lint:workflows` runs
      # locally too
      - name: Lint the workflows
        run: bash scripts/lint-workflows.sh
      # every relative link and anchor of the contributor guide and the skills (pnpm lint:guide)
      - name: Check the guide's links
        run: node scripts/check-guide-links.mjs
      # the agent skills' frontmatter, sizes, contents lists, reference depth and site links (pnpm lint:skills)
      - name: Check the skills
        run: node scripts/check-skills.mjs
      # every path of the release checks, in throwaway repositories with a fake npm (seconds, no network)
      - name: Test the release checks
        run: bash scripts/release-check.test.sh

  package:
    name: ${{ inputs.release == '' && 'Unit tests and package' || format('Download pomwright {0}', inputs.release) }}
    runs-on: ubuntu-latest
    steps:
      - if: inputs.release == ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - if: inputs.release == ''
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0
      - if: inputs.release == ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
      - if: inputs.release == ''
        run: pnpm install --frozen-lockfile
      - if: inputs.release == ''
        run: pnpm test:unit
      - if: inputs.release == ''
        name: Build and pack
        run: bash pack-build.sh pomwright-test-build.tgz
      # With release: the published tarball itself, which npm checks against the registry's integrity on the way in;
      # no checkout, so no lockfile for a cache
      - if: inputs.release != ''
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: true
      - if: inputs.release != ''
        name: Download the published tarball
        env:
          RELEASE: ${{ inputs.release }}
        shell: bash # with pipefail, so a failing npm pack fails here
        run: |
          file="$(npm pack "pomwright@$RELEASE" | tail -n 1)"
          mv "$file" pomwright-test-build.tgz
          packed="$(tar -xzOf pomwright-test-build.tgz package/package.json | node -p 'JSON.parse(require("fs").readFileSync(0, "utf8")).version')"
          echo "$file holds pomwright $packed"
          test "$packed" = "$RELEASE"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pomwright-package
          path: pomwright-test-build.tgz
          if-no-files-found: error
          retention-days: 7

  harness:
    name: Harness (${{ matrix.browser }}, Playwright ${{ matrix.playwright }})
    needs: package
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browsers) }}
        # pin and latest; with release, latest and, when set, playwright-extra, the row named after its version
        playwright: ${{ fromJSON(inputs.release == '' && '["pin", "latest"]' || (inputs.playwright-extra == '' && '["latest"]' || format('["latest", "{0}"]', inputs.playwright-extra))) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-commit }} # empty: the commit of the event
      # First, with the runner's own Node: a skipped job must not set up the pnpm cache, because setup-node's post
      # step fails when the store it should save does not exist.
      - id: playwright
        name: Resolve the Playwright version
        env:
          ROW: ${{ matrix.playwright }}
          RELEASE: ${{ inputs.release }}
        run: |
          if [[ "$ROW" != pin && "$ROW" != latest ]]; then
            echo "playwright-extra: $ROW"
            { echo "version=$ROW"; echo "skip=false"; } >>"$GITHUB_OUTPUT"
          elif [[ -z "$RELEASE" ]]; then
            bash scripts/ci-playwright-version.sh "$ROW"
          else
            # No pin row with release: latest runs even when it is the pin, as the pin. The checked-out script writes
            # its own outputs when GITHUB_OUTPUT is set, so it runs without and this step writes them.
            resolved="$(GITHUB_OUTPUT='' bash scripts/ci-playwright-version.sh "$ROW")"
            echo "$resolved"
            version="$(sed -n 's/^version=//p' <<<"$resolved")"
            if grep -qx 'skip=true' <<<"$resolved"; then version=""; fi
            { echo "version=$version"; echo "skip=false"; } >>"$GITHUB_OUTPUT"
          fi
      - if: steps.playwright.outputs.skip == 'true'
        name: The latest Playwright is the pin; the pin row runs it
        run: echo "Nothing to run."
      - if: steps.playwright.outputs.skip != 'true'
        uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: ${{ inputs.release == '' && '12.14.0' || '' }} # with release, the commit's packageManager
      - if: steps.playwright.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: ${{ inputs.release != '' }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/pnpm-lock.yaml
      - if: steps.playwright.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pomwright-package
          path: ${{ runner.temp }}/package
      - if: steps.playwright.outputs.skip != 'true'
        name: Run the harness against the packed package
        env:
          CI: "true"
          POMWRIGHT_TARBALL: ${{ runner.temp }}/package/pomwright-test-build.tgz
          PLAYWRIGHT_VERSION: ${{ steps.playwright.outputs.version }}
          PLAYWRIGHT_INSTALL_ARGS: --with-deps ${{ matrix.browser }}
          PROJECT: ${{ matrix.browser }}
        run: bash pack-test.sh --project="$PROJECT"
      - if: failure() && steps.playwright.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.playwright }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/playwright-report
          retention-days: 30

  # The chromium harness at the pin on each LTS Node line below the default (Node 26), from the engines floor.
  harness-node:
    name: Harness (chromium, Playwright pin, Node ${{ matrix.node }})
    needs: package
    if: inputs.older-node-lines
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ["20", "22", "24"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}.x
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/pnpm-lock.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pomwright-package
          path: ${{ runner.temp }}/package
      - name: Run the harness against the packed package on Node ${{ matrix.node }}
        env:
          CI: "true"
          POMWRIGHT_TARBALL: ${{ runner.temp }}/package/pomwright-test-build.tgz
          PLAYWRIGHT_INSTALL_ARGS: --with-deps chromium
        run: bash pack-test.sh --project=chromium
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-chromium-node${{ matrix.node }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/playwright-report
          retention-days: 30

  # No page of the test server loads anything from another host (test-server-check.sh): every route test/server.js
  # lists, opened in chromium, and a scan of the server's source and test data. Once per run, in a job of its own: what
  # a page requests depends on no browser, Playwright version or Node line, and a failure here is not a harness failure.
  test-server:
    name: "Test server: no external requests"
    needs: package
    if: inputs.release == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: test/pnpm-lock.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pomwright-package
          path: ${{ runner.temp }}/package
      - name: Open every page of the test server, and scan its source and test data
        env:
          CI: "true"
          POMWRIGHT_TARBALL: ${{ runner.temp }}/package/pomwright-test-build.tgz
          PLAYWRIGHT_INSTALL_ARGS: --with-deps chromium
        run: bash test-server-check.sh
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-test-server-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/playwright-report/test-server
          retention-days: 30

  # The package as consumers install it, with npm into projects of their own rather than the harness's: TypeScript under
  # each module resolution, attw, Playwright's runner in a CommonJS and an ESM project, and TypeScript 5.0 to the latest
  # release in both decorator modes (scripts/consumer-check.sh, which runs the same by hand); then, on Node 20, the
  # engines floor, import and require sharing one copy.
  consumer:
    name: Consumer installs
    needs: package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.release-commit }} # empty: the commit of the event
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          check-latest: ${{ inputs.release != '' }}
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pomwright-package
          path: ${{ runner.temp }}/package
      - name: TypeScript resolutions and versions, attw, Playwright's runner
        shell: bash
        run: bash scripts/consumer-check.sh "$RUNNER_TEMP/package/pomwright-test-build.tgz"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x
          check-latest: ${{ inputs.release != '' }}
      - name: import and require share one copy on Node 20
        shell: bash
        run: bash scripts/consumer-check.sh --node-floor "$RUNNER_TEMP/package/pomwright-test-build.tgz"

  # The documentation: its TypeScript examples compiled and the API reference checked against the packed package, as
  # the harness's type check does, then the site built, which fails on a link or an anchor that does not exist, and every
  # diagram rendered. pages.yaml deploys the same build.
  site:
    name: Documentation and site
    needs: package
    if: inputs.release == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/pnpm-lock.yaml
            website/pnpm-lock.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pomwright-package
          path: ${{ runner.temp }}/package
      - name: Install the packed package into test/
        env:
          TARBALL: ${{ runner.temp }}/package/pomwright-test-build.tgz
        run: |
          pnpm install --frozen-lockfile
          bash pack-extract.sh "$TARBALL"
          pnpm -C test install --frozen-lockfile
      - name: Compile the documentation's examples
        run: node scripts/check-doc-snippets.mjs
      - name: Check the API reference and the doc comments
        run: node scripts/check-api-coverage.mjs
      - name: Build the site
        run: |
          pnpm -C website install --frozen-lockfile
          pnpm -C website build
      # Diagrams render in the browser, so the build cannot catch one that fails: each is opened in Chromium, light and
      # dark (scripts/check-diagrams.mjs, which pnpm docs:diagrams runs by hand)
      - name: Render every diagram
        run: |
          pnpm exec playwright install --with-deps chromium
          node scripts/check-diagrams.mjs
