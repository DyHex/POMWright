name: Checks

# The jobs of every CI run, called by pr.yaml (pull requests) and main.yaml (pushes to main). Lint always runs. The
# changes job compares the commit with the last green commit of the branch (the newest commit whose run of the
# caller's workflow succeeded) and, on a pull request, with its base, never with the previous push alone (that would let
# a docs-only push turn a red run green): code is a change outside website/ that is not *.md, site is code or a change
# under website/. The package job runs on either; the harness on code; the site job on site. A skipped job is reported
# as success. A change to the documentation's pages only runs lint, the package and the site job.
# The package job builds and packs once; every harness job and the site job test that tarball. The harness runs on the
# browsers the caller asks for, each at the Playwright pin and at the latest 1.x, and with node-floor (set by pr.yaml and
# main.yaml) also on chromium at the pin on Node 20, the floor of package.json's engines (the unit tests stay on Node 24:
# vitest needs 22.12). Third-party actions are pinned to commits, the version in a comment; Dependabot
# (.github/dependabot.yml) proposes updates.

on:
  workflow_call:
    inputs:
      browsers:
        description: JSON array of the Playwright projects the harness runs, each at the pin and at the latest version
        type: string
        default: '["chromium", "firefox", "webkit"]'
      workflow:
        description: The caller's workflow file (pr.yaml or main.yaml), whose successful runs mark the green commits
        type: string
        required: true
      node-floor:
        description: Also run the harness on chromium at the Playwright pin on Node 20, the engines floor
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # the runs API, to find the last green commit

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
      site: ${{ steps.changes.outputs.site }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - id: green
        name: Last green commit of the branch
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.workflow }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          HEAD_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: echo "sha=$(bash scripts/ci-last-green.sh "$GITHUB_REPOSITORY" "$WORKFLOW" "$EVENT" "$BRANCH" "$HEAD_REPO" "$HEAD_SHA")" >>"$GITHUB_OUTPUT"
      - id: changes
        name: Which jobs does the change need?
        env:
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GREEN: ${{ steps.green.outputs.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-changes.sh "$HEAD_SHA" "$GREEN" "$PR_BASE"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  package:
    name: Unit tests and package
    needs: changes
    if: needs.changes.outputs.code == 'true' || needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - name: Build and pack
        run: bash pack-build.sh pomwright-test-build.tgz
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pomwright-package
          path: pomwright-test-build.tgz
          if-no-files-found: error
          retention-days: 7

  harness:
    name: Harness (${{ matrix.browser }}, Playwright ${{ matrix.playwright }})
    needs: [changes, package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browsers) }}
        playwright: [pin, latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # First, with the runner's own Node: a skipped job must not set up the pnpm cache, because setup-node's post
      # step fails when the store it should save does not exist.
      - id: playwright
        name: Resolve the Playwright version
        env:
          ROW: ${{ matrix.playwright }}
        run: bash scripts/ci-playwright-version.sh "$ROW"
      - if: steps.playwright.outputs.skip == 'true'
        name: The latest Playwright is the pin; the pin row runs it
        run: echo "Nothing to run."
      - if: steps.playwright.outputs.skip != 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - if: steps.playwright.outputs.skip != 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/pnpm-lock.yaml
      - if: steps.playwright.outputs.skip != 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pomwright-package
          path: ${{ runner.temp }}/package
      - if: steps.playwright.outputs.skip != 'true'
        name: Run the harness against the packed package
        env:
          CI: "true"
          POMWRIGHT_TARBALL: ${{ runner.temp }}/package/pomwright-test-build.tgz
          PLAYWRIGHT_VERSION: ${{ steps.playwright.outputs.version }}
          PLAYWRIGHT_INSTALL_ARGS: --with-deps ${{ matrix.browser }}
          PROJECT: ${{ matrix.browser }}
        run: bash pack-test.sh --project="$PROJECT"
      - if: failure() && steps.playwright.outputs.skip != 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.playwright }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/playwright-report
          retention-days: 30

  harness-node-floor:
    name: Harness (chromium, Playwright pin, Node 20)
    needs: [changes, package]
    if: inputs.node-floor && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20.x
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/pnpm-lock.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pomwright-package
          path: ${{ runner.temp }}/package
      - name: Run the harness against the packed package on Node 20
        env:
          CI: "true"
          POMWRIGHT_TARBALL: ${{ runner.temp }}/package/pomwright-test-build.tgz
          PLAYWRIGHT_INSTALL_ARGS: --with-deps chromium
        run: bash pack-test.sh --project=chromium
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report-chromium-node20-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/playwright-report
          retention-days: 30

  # The documentation: its TypeScript examples compiled and the API reference checked against the packed package, as
  # the harness's type check does, then the site built, which fails on a link or an anchor that does not exist.
  # pages.yaml deploys the same build.
  site:
    name: Documentation and site
    needs: [changes, package]
    if: needs.changes.outputs.site == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/pnpm-lock.yaml
            website/pnpm-lock.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: pomwright-package
          path: ${{ runner.temp }}/package
      - name: Install the packed package into test/
        env:
          TARBALL: ${{ runner.temp }}/package/pomwright-test-build.tgz
        run: |
          pnpm install --frozen-lockfile
          bash pack-extract.sh "$TARBALL"
          pnpm -C test install --frozen-lockfile
      - name: Compile the documentation's examples
        run: node scripts/check-doc-snippets.mjs
      - name: Check the API reference and the doc comments
        run: node scripts/check-api-coverage.mjs
      - name: Build the site
        run: |
          pnpm -C website install --frozen-lockfile
          pnpm -C website build
