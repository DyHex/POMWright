name: Checks

# The jobs of every CI run, called by pr.yaml (pull requests) and main.yaml (pushes to main). Lint always runs; the
# unit tests, the build and the harness are skipped, which GitHub reports as success, when only *.md files outside
# website/ (whose pages' examples the harness's type check compiles) changed since the last green commit of the branch
# (the newest commit whose run of the caller's workflow succeeded) or, on a pull request, since its base. Never since the
# previous push alone: that would let a docs-only push turn a red run green.
# The package job builds and packs once; every harness job tests that tarball, on the browsers the caller asks for, and
# with node-floor (set by pr.yaml and main.yaml) also on chromium at the pin on Node 20, the floor of package.json's engines (the unit tests stay on
# Node 24: vitest needs 22.12). Third-party actions are pinned to commits, the version in a comment; Dependabot
# (.github/dependabot.yml) proposes updates.

on:
  workflow_call:
    inputs:
      browsers:
        description: JSON array of the Playwright projects the harness runs, each at the pin and at the latest version
        type: string
        default: '["chromium", "firefox", "webkit"]'
      workflow:
        description: The caller's workflow file (pr.yaml or main.yaml), whose successful runs mark the green commits
        type: string
        required: true
      node-floor:
        description: Also run the harness on chromium at the Playwright pin on Node 20, the engines floor
        type: boolean
        default: false

permissions:
  contents: read
  actions: read # the runs API, to find the last green commit

jobs:
  changes:
    name: Changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.changes.outputs.code }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - id: green
        name: Last green commit of the branch
        env:
          GH_TOKEN: ${{ github.token }}
          WORKFLOW: ${{ inputs.workflow }}
          EVENT: ${{ github.event_name }}
          BRANCH: ${{ github.event_name == 'pull_request' && github.head_ref || github.ref_name }}
          HEAD_REPO: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name || github.repository }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: echo "sha=$(bash scripts/ci-last-green.sh "$GITHUB_REPOSITORY" "$WORKFLOW" "$EVENT" "$BRANCH" "$HEAD_REPO" "$HEAD_SHA")" >>"$GITHUB_OUTPUT"
      - id: changes
        name: Anything other than *.md outside website/ changed?
        env:
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
          GREEN: ${{ steps.green.outputs.sha }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/ci-changes.sh "$HEAD_SHA" "$GREEN" "$PR_BASE"

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint

  package:
    name: Unit tests and package
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:unit
      - name: Build and pack
        run: bash pack-build.sh pomwright-test-build.tgz
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: pomwright-package
          path: pomwright-test-build.tgz
          if-no-files-found: error
          retention-days: 7

  harness:
    name: Harness (${{ matrix.browser }}, Playwright ${{ matrix.playwright }})
    needs: [changes, package]
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        browser: ${{ fromJSON(inputs.browsers) }}
        playwright: [pin, latest]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # First, with the runner's own Node: a skipped job must not set up the pnpm cache, because setup-node's post
      # step fails when the store it should save does not exist.
      - id: playwright
        name: Resolve the Playwright version
        env:
          ROW: ${{ matrix.playwright }}
        run: bash scripts/ci-playwright-version.sh "$ROW"
      - if: steps.playwright.outputs.skip == 'true'
        name: The latest Playwright is the pin; the pin row runs it
        run: echo "Nothing to run."
      - if: steps.playwright.outputs.skip != 'true'
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.12.0
      - if: steps.playwright.outputs.skip != 'true'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/pnpm-lock.yaml
      - if: steps.playwright.outputs.skip != 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pomwright-package
          path: ${{ runner.temp }}/package
      - if: steps.playwright.outputs.skip != 'true'
        name: Run the harness against the packed package
        env:
          CI: "true"
          POMWRIGHT_TARBALL: ${{ runner.temp }}/package/pomwright-test-build.tgz
          PLAYWRIGHT_VERSION: ${{ steps.playwright.outputs.version }}
          PLAYWRIGHT_INSTALL_ARGS: --with-deps ${{ matrix.browser }}
          PROJECT: ${{ matrix.browser }}
        run: bash pack-test.sh --project="$PROJECT"
      - if: failure() && steps.playwright.outputs.skip != 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-${{ matrix.browser }}-${{ matrix.playwright }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/playwright-report
          retention-days: 30

  harness-node-floor:
    name: Harness (chromium, Playwright pin, Node 20)
    needs: [changes, package]
    if: inputs.node-floor && needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0
        with:
          version: 9.12.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 20.x
          cache: pnpm
          cache-dependency-path: |
            pnpm-lock.yaml
            test/pnpm-lock.yaml
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: pomwright-package
          path: ${{ runner.temp }}/package
      - name: Run the harness against the packed package on Node 20
        env:
          CI: "true"
          POMWRIGHT_TARBALL: ${{ runner.temp }}/package/pomwright-test-build.tgz
          PLAYWRIGHT_INSTALL_ARGS: --with-deps chromium
        run: bash pack-test.sh --project=chromium
      - if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report-chromium-node20-${{ github.run_id }}-${{ github.run_attempt }}
          path: test/playwright-report
          retention-days: 30
