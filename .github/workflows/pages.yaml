name: Pages

# Builds the documentation site in website/ and deploys it to GitHub Pages, https://dyhex.github.io/POMWright/. The
# build is the site job's of checks.yaml: it fails on a link or an anchor that does not exist.
# Pre-release: deploys every push to the 3.0.0 branch while it is tested. Before the merge, switch the trigger to
# workflow_run below, guarded as publish.yaml is, so the site deploys after CI succeeds on a push to main.

on:
  push:
    branches: [chore/bugfixes-quality-improvements-and-docs]
  # workflow_run:
  #   workflows: [CI]
  #   branches: [main]
  #   types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - run: pnpm -C website install --frozen-lockfile
      - run: pnpm -C website build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
