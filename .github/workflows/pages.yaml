name: Pages

# Builds the documentation site in website/ and deploys it to GitHub Pages, https://dyhex.github.io/POMWright/. The
# build is the site job's of checks.yaml: it fails on a link or an anchor that does not exist. It runs after CI succeeds
# on a push to main, guarded as publish.yaml is, and builds the commit CI tested, but only while that commit is main's
# tip; or by hand, building the commit it was started on.

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    # as publish.yaml guards itself: a successful CI run of a push to main in this repository, or a manual run
    if: >-
      github.event_name == 'workflow_dispatch' || (
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.tip.outputs.deploy }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # the commit CI tested; a manual run builds the commit it was started on
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      # A re-run of an older CI run keeps its commit, and deploying it would put an older site over a newer one. The newer
      # commit's own run deploys a site that already holds this commit's changes, so only main's tip is deployed.
      - name: Deploy only main's tip
        id: tip
        shell: bash # -eo pipefail: a failed git ls-remote fails the step instead of reading as a moved main
        env:
          EVENT: ${{ github.event_name }}
          TESTED_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "$EVENT" != "workflow_run" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tip="$(git ls-remote origin refs/heads/main | cut -f1)"
          if [ "$tip" = "$TESTED_SHA" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "main has moved past $TESTED_SHA to $tip; that commit's own run deploys a site that already holds this one"
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.tip.outputs.deploy == 'true'
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 12.14.0
      - if: steps.tip.outputs.deploy == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24.x
          cache: pnpm
          cache-dependency-path: website/pnpm-lock.yaml
      - if: steps.tip.outputs.deploy == 'true'
        run: pnpm -C website install --frozen-lockfile
      - if: steps.tip.outputs.deploy == 'true'
        run: pnpm -C website build
      - if: steps.tip.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
