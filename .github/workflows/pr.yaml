name: PR

# Every pull request, draft or not, from this repository or a fork. The harness runs on chromium only, also on Node 20,
# the engines floor; main.yaml runs all three browsers after the merge. Publish never listens to this workflow.

on:
  pull_request:

permissions:
  contents: read
  actions: read # checks.yaml reads the runs of this workflow to find the last green commit

jobs:
  checks:
    uses: ./.github/workflows/checks.yaml
    with:
      browsers: '["chromium"]' # firefox and webkit run on main (main.yaml)
      workflow: pr.yaml
      node-floor: true # the chromium harness on Node 20 as well, before the merge

  # The gate. Its job id is the required status check of main ("build"): do not rename it without changing the
  # branch protection rule with it.
  build:
    needs: checks
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Require the checks to have passed
        env:
          RESULT: ${{ needs.checks.result }}
        run: |
          echo "checks: $RESULT"
          test "$RESULT" = "success"
